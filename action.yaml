name: "Drupal Module CI"
description: "Creates a Drupal test project, installs a custom module with Composer, and runs PHPUnit coverage."

inputs:
  action_ref:
    description: "Git ref of this action repository to check out internally"
    required: false
    default: "main"
  drupal_version:
    description: "Drupal version to install"
    required: false
    default: "10"
  core_dev_version:
    description: "Version constraint for drupal/core-dev. Defaults to ^<drupal_version>."
    required: false
    default: ""
  drush_version:
    description: "Version constraint for drush/drush"
    required: false
    default: "^13.0"
  faker_version:
    description: "Version constraint for fakerphp/faker"
    required: false
    default: "^1.24"
  module_name:
    description: "Drupal machine name of the custom module"
    required: true
  repo_name:
    description: "Repository name used for Composer package resolution"
    required: true
  repo_org:
    description: "GitHub organization or user that owns the custom module repository"
    required: true
  repo_ref:
    description: "Composer version constraint or VCS ref to require for the custom module"
    required: true
  module_vendor:
    description: "Composer vendor name for the custom module package"
    required: true
  module_package:
    description: "Full Composer package name for the custom module. Defaults to <module_vendor>/<repo_name>."
    required: false
    default: ""
  module_dir:
    description: "Drupal modules directory where the package should be installed"
    required: false
    default: "web/modules/custom"
  project_dir:
    description: "Directory where the temporary Drupal project should be created"
    required: false
    default: "/tmp/drupal-site"
  composer_repositories:
    description: "Additional Composer repositories, one per line. Supports repo, org/repo, name=url, or name:git@... formats."
    required: false
    default: ""
  composer_gh_pat:
    description: "GitHub token used for private Composer or VCS dependencies"
    required: false
  simpletest_db:
    description: "Database URL for Simpletest"
    required: false
    default: "mysql://root:root@mysql:3306/drupal_test"
  working_directory:
    description: "Path to the checked-out custom module repository. Defaults to github.workspace and configures the module as a local path repository."
    required: false
    default: ${{ github.workspace }}

runs:
  using: "composite"
  steps:

    - name: Fix git ownership
      shell: bash
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        git config --global --add safe.directory "${GITHUB_WORKSPACE}/.drupal-ci"

    - name: Add GitHub to known_hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        touch ~/.ssh/known_hosts
        ssh-keygen -F github.com -f ~/.ssh/known_hosts >/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts
    
    - name: Check out action repo
      uses: actions/checkout@v4
      with:
        repository: nbey/drupal-custom-module-ci
        ref: ${{ inputs.action_ref }}
        path: .drupal-ci

    - name: Prepare Drupal project and Composer config
      shell: bash
      env:
        DRUPAL_VERSION: ${{ inputs.drupal_version }}
        DRUPAL_CORE_DEV_VERSION: ${{ inputs.core_dev_version }}
        DRUSH_VERSION: ${{ inputs.drush_version }}
        FAKER_VERSION: ${{ inputs.faker_version }}
        DRUPAL_PROJECT_DIR: ${{ inputs.project_dir }}
        DRUPAL_CUSTOM_MODULE_DIR: ${{ inputs.module_dir }}
        CUSTOM_MODULE_NAME: ${{ inputs.module_name }}
        CUSTOM_MODULE_REPOSITORY_ORG: ${{ inputs.repo_org }}
        CUSTOM_MODULE_REPOSITORY_NAME: ${{ inputs.repo_name }}
        CUSTOM_MODULE_REPOSITORY_REF: ${{ inputs.repo_ref }}
        CUSTOM_MODULE_VENDOR: ${{ inputs.module_vendor }}
        CUSTOM_MODULE_PACKAGE: ${{ inputs.module_package }}
        COMPOSER_REPOSITORIES: ${{ inputs.composer_repositories }}
        COMPOSER_GH_PAT: ${{ inputs.composer_gh_pat }}
        CUSTOM_MODULE_WORKING_DIRECTORY: ${{ inputs.working_directory }}

      run: node .drupal-ci/scripts/setup-composer.js

    - name: Composer Install
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.project_dir }}
        composer-options: "--no-interaction --prefer-dist"

    - name: Install Drupal Site
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        SIMPLETEST_DB: ${{ inputs.simpletest_db }}
      run: |
        ./vendor/bin/drush site:install testing --db-url="${SIMPLETEST_DB}" --account-name=admin --account-pass=admin -y
        ./vendor/bin/drush role:perm:add anonymous 'access content'

    - name: Create Test Output Dirs
      shell: bash
      run: |
        mkdir -p /tmp/coverage
        mkdir -p /tmp/simpletest_browser_output

    - name: Set Environment Variables for PHPUnit
      shell: bash
      run: |
        mkdir -p /tmp/simpletest_browser_output
      
        echo 'MINK_DRIVER_ARGS_WEBDRIVER=["chrome", {"browserName": "chrome", "goog:chromeOptions": {"args": ["--headless=new", "--no-sandbox", "--disable-gpu", "--window-size=1280,1024", "--user-data-dir=/tmp/chrome-profile-${RANDOM}"]}}, "http://localhost:9515"]' >> $GITHUB_ENV
        echo 'BROWSERTEST_OUTPUT_DIRECTORY=/tmp/simpletest_browser_output' >> $GITHUB_ENV
        echo 'SIMPLETEST_BASE_URL=http://127.0.0.1' >> $GITHUB_ENV
        echo 'SYMFONY_DEPRECATIONS_HELPER=weak' >> $GITHUB_ENV

    - name: Run PHP Server
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        php -S 127.0.0.1:80 -t web/ >/tmp/drupal-php-server.log 2>&1 &

        for attempt in {1..30}; do
          if curl --silent --fail http://127.0.0.1 >/dev/null; then
            exit 0
          fi

          sleep 1
        done

        echo "Drupal PHP server did not become ready in time."
        cat /tmp/drupal-php-server.log || true
        exit 1

    - name: Run PHPUnit with coverage
      id: run_tests
      shell: bash
      working-directory: ${{ inputs.project_dir }}/web
      continue-on-error: true
      run: |
        module_dir="${{ inputs.module_dir }}"
        module_dir="${module_dir#web/}"
        ../vendor/bin/phpunit -c core/phpunit.xml.dist -v --color --testdox \
        --coverage-html /tmp/coverage \
        ${module_dir}/${{ inputs.module_name }}/tests/src/

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: /tmp/coverage/

    - name: Upload simple browser artifacts
      uses: actions/upload-artifact@v4
      with:
        name: simpletest_browser_output
        path: /tmp/simpletest_browser_output/

    - name: Fail the job if tests failed
      shell: bash
      if: steps.run_tests.outcome == 'failure'  # Re-fail the job after upload
      run: exit 1
