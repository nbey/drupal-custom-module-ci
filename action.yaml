name: "Drupal Module CI"
description: "Creates a Drupal test project, installs a custom module through Composer, and runs PHPUnit coverage."

inputs:
  action_ref:
    description: "Git ref of this action repository to check out internally"
    required: false
    default: ""
  drupal_version:
    description: "Drupal version to install"
    required: false
    default: "10"
  drupal_module_name:
    description: "Drupal module machine name, for example acp_2fa"
    required: false
    default: ""
  module_name:
    description: "Deprecated alias for drupal_module_name"
    required: false
    default: ""
  drupal_module_path:
    description: "Installed module directory name under the Drupal module directory. Defaults to drupal_module_name."
    required: false
    default: ""
  drupal_module_dir:
    description: "Drupal modules parent directory where the package should be installed. When omitted, falls back to the legacy module_dir input."
    required: false
    default: ""
  repo_name:
    description: "Repository name used for the module VCS repository"
    required: true
  repo_org:
    description: "GitHub organization or user that owns the module repository"
    required: true
  repo_ref:
    description: "Composer version constraint or VCS ref to require"
    required: true
  composer_package_name:
    description: "Full Composer package name, for example acp/2fa. Defaults to <module_vendor>/<repo_name>."
    required: false
    default: ""
  module_vendor:
    description: "Composer vendor used when composer_package_name is not provided"
    required: false
    default: ""
  module_dir:
    description: "Deprecated alias for drupal_module_dir"
    required: false
    default: "web/modules/acp-composer"
  project_dir:
    description: "Directory to install the Drupal project"
    required: false
    default: "/tmp/drupal-site"
  composer_repositories:
    description: "Additional Composer repositories, one per line. Supports repo, org/repo, name=url, or name:git@... formats."
    required: false
    default: ""
  composer_gh_pat:
    description: "GitHub token used for private Composer or VCS dependencies"
    required: false
  simpletest_db:
    description: "Database URL for Simpletest"
    required: false
    default: "mysql://root:root@mysql:3306/drupal_test"
  working_directory:
    description: "Path to the checked-out module repository. Defaults to github.workspace for local path installation."
    required: false
    default: ${{ github.workspace }}
  debug:
    description: "Enable verbose module path diagnostics output and artifacts"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:

    - name: Fix git ownership
      shell: bash
      run: |
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        git config --global --add safe.directory "${GITHUB_WORKSPACE}/.drupal-ci"

    - name: Add GitHub to known_hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        touch ~/.ssh/known_hosts
        ssh-keygen -F github.com -f ~/.ssh/known_hosts >/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts

    - name: Check out action repo
      uses: actions/checkout@v4
      with:
        repository: nbey/drupal-custom-module-ci
        ref: ${{ inputs.action_ref || github.action_ref || 'main' }}
        path: .drupal-ci

    - name: Prepare Drupal project and Composer config
      shell: bash
      env:
        DRUPAL_VERSION: ${{ inputs.drupal_version }}
        DRUPAL_PROJECT_DIR: ${{ inputs.project_dir }}
        DRUPAL_CUSTOM_MODULE_DIR: ${{ inputs.drupal_module_dir || inputs.module_dir }}
        DRUPAL_MODULE_NAME: ${{ inputs.drupal_module_name || inputs.module_name }}
        DRUPAL_MODULE_PATH: ${{ inputs.drupal_module_path }}
        CUSTOM_MODULE_NAME: ${{ inputs.module_name }}
        CUSTOM_MODULE_REPOSITORY_ORG: ${{ inputs.repo_org }}
        CUSTOM_MODULE_REPOSITORY_NAME: ${{ inputs.repo_name }}
        CUSTOM_MODULE_REPOSITORY_REF: ${{ inputs.repo_ref }}
        CUSTOM_MODULE_VENDOR: ${{ inputs.module_vendor }}
        COMPOSER_PACKAGE_NAME: ${{ inputs.composer_package_name }}
        COMPOSER_REPOSITORIES: ${{ inputs.composer_repositories }}
        COMPOSER_GH_PAT: ${{ inputs.composer_gh_pat }}
        CUSTOM_MODULE_WORKING_DIRECTORY: ${{ inputs.working_directory }}

      run: node .drupal-ci/scripts/setup-composer.js

    - name: Composer Install
      uses: ramsey/composer-install@v3
      with:
        working-directory: ${{ inputs.project_dir }}
        composer-options: "--no-interaction --prefer-dist"

    - name: Collect module diagnostics
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        module_dir="${{ inputs.drupal_module_dir || inputs.module_dir }}"
        module_path="${{ inputs.drupal_module_path || inputs.drupal_module_name || inputs.module_name }}"
        working_directory="${{ inputs.working_directory }}"
        package_name="${{ inputs.composer_package_name }}"

        if [ -z "${package_name}" ]; then
          legacy_module_name="${{ inputs.module_name || inputs.drupal_module_name }}"
          package_name="${{ inputs.module_vendor }}/$(printf '%s' "${legacy_module_name}" | tr '_' '-')"
        fi

        module_dir="${module_dir#web/}"
        tests_path="web/${module_dir}/${module_path}/tests/src"
        diagnostics_file="/tmp/drupal-ci-module-diagnostics.txt"

        {
          echo "Computed Drupal module directory: ${module_dir}"
          echo "Computed Drupal module path: ${module_path}"
          echo "Expected PHPUnit tests path: ${tests_path}"
          echo "Composer package name: ${package_name}"
          echo "Working directory: ${working_directory}"
          echo

          if [ -f "composer.json" ]; then
            echo '[project composer.json]'
            cat composer.json
            echo
          fi

          if [ -f "${working_directory}/composer.json" ]; then
            echo '[working directory composer.json]'
            php -r '$composer = json_decode(file_get_contents($argv[1]), true); echo "name=" . ($composer["name"] ?? "") . PHP_EOL; echo "installer-name=" . ($composer["extra"]["installer-name"] ?? "") . PHP_EOL;' "${working_directory}/composer.json" || true
            echo
          fi

          echo '[composer show]'
          composer show "${package_name}" || true
          echo

          echo '[web/modules tree]'
          find web/modules -maxdepth 3 -type d | sort || true
          echo

          echo "[listing web/${module_dir}]"
          ls -la "web/${module_dir}" || true
          echo

          echo "[listing web/${module_dir}/${module_path}]"
          ls -la "web/${module_dir}/${module_path}" || true
        } | tee "${diagnostics_file}"

    - name: Install Drupal Site
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      env:
        SIMPLETEST_DB: ${{ inputs.simpletest_db }}
      run: |
        ./vendor/bin/drush site:install testing --db-url="${SIMPLETEST_DB}" --account-name=admin --account-pass=admin -y
        ./vendor/bin/drush role:perm:add anonymous 'access content'

    - name: Create Test Output Dirs
      shell: bash
      run: |
        mkdir -p /tmp/coverage
        mkdir -p /tmp/simpletest_browser_output

    - name: Set Environment Variables for PHPUnit
      shell: bash
      run: |
        mkdir -p /tmp/simpletest_browser_output
      
        echo 'MINK_DRIVER_ARGS_WEBDRIVER=["chrome", {"browserName": "chrome", "goog:chromeOptions": {"args": ["--headless=new", "--no-sandbox", "--disable-gpu", "--window-size=1280,1024", "--user-data-dir=/tmp/chrome-profile-${RANDOM}"]}}, "http://localhost:9515"]' >> $GITHUB_ENV
        echo 'BROWSERTEST_OUTPUT_DIRECTORY=/tmp/simpletest_browser_output' >> $GITHUB_ENV
        echo 'SIMPLETEST_BASE_URL=http://127.0.0.1' >> $GITHUB_ENV
        echo 'SYMFONY_DEPRECATIONS_HELPER=weak' >> $GITHUB_ENV

    - name: Run PHP Server
      shell: bash
      working-directory: ${{ inputs.project_dir }}
      run: |
        php -S 127.0.0.1:80 -t web/ >/tmp/drupal-php-server.log 2>&1 &

        for attempt in {1..30}; do
          if curl --silent --fail http://127.0.0.1 >/dev/null; then
            exit 0
          fi

          sleep 1
        done

        echo "Drupal PHP server did not become ready in time."
        cat /tmp/drupal-php-server.log || true
        exit 1

    - name: Run PHPUnit with coverage
      id: run_tests
      shell: bash
      working-directory: ${{ inputs.project_dir }}/web
      continue-on-error: true
      run: |
        module_dir="${{ inputs.drupal_module_dir || inputs.module_dir }}"
        module_path="${{ inputs.drupal_module_path || inputs.drupal_module_name || inputs.module_name }}"
        tests_path="${module_dir#web/}/${module_path}/tests/src"

        if [ -z "${module_path}" ]; then
          echo "Missing drupal_module_path or drupal_module_name/module_name input."
          exit 1
        fi

        if [ ! -d "${tests_path}" ]; then
          echo "Resolved PHPUnit tests path does not exist: ${tests_path}"
          echo "Module diagnostics:"
          cat /tmp/drupal-ci-module-diagnostics.txt || true
          exit 1
        fi

        ../vendor/bin/phpunit -c core/phpunit.xml.dist -v --color --testdox \
        --coverage-html /tmp/coverage \
        "${tests_path}"

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: /tmp/coverage/

    - name: Upload module diagnostics artifact
      if: ${{ inputs.debug == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: drupal-ci-module-diagnostics
        path: /tmp/drupal-ci-module-diagnostics.txt
        if-no-files-found: ignore

    - name: Upload simple browser artifacts
      uses: actions/upload-artifact@v4
      with:
        name: simpletest_browser_output
        path: /tmp/simpletest_browser_output/

    - name: Fail the job if tests failed
      shell: bash
      if: steps.run_tests.outcome == 'failure'  # Re-fail the job after upload
      run: exit 1
